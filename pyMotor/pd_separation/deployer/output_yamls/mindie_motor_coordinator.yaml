apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindie-motor-coordinator
  labels:
    app: mindie-motor-coordinator
    job-name: mindie-tmx-coordinator-17841163815622d27ce44
  namespace: mindie-tmx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mindie-motor-coordinator
  template:
    metadata:
      labels:
        app: mindie-motor-coordinator
    spec:
      terminationGracePeriodSeconds: 0
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
      tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 30
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 30
      containers:
      - image: mindie-motor-vllm:decode-affinity-full
        imagePullPolicy: IfNotPresent
        name: mindie-motor-coordinator
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: Unconfined
        startupProbe:
          exec:
            command:
            - bash
            - -c
            - $CONFIGMAP_PATH/probe.sh startup
          periodSeconds: 5
          failureThreshold: 100
        readinessProbe:
          exec:
            command:
            - bash
            - -c
            - $CONFIGMAP_PATH/probe.sh readiness
          periodSeconds: 5
          timeoutSeconds: 4
          failureThreshold: 12
        livenessProbe:
          exec:
            command:
            - bash
            - -c
            - $CONFIGMAP_PATH/probe.sh liveness
          periodSeconds: 5
          timeoutSeconds: 4
          failureThreshold: 12
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: CONFIGMAP_PATH
          value: /mnt/configmap
        - name: CONFIG_PATH
          value: /usr/local/Ascend/pyMotor/conf
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: ROLE
          value: coordinator
        - name: JOB_NAME
          value: mindie-tmx-coordinator-17841163815622d27ce44
        - name: CONTROLLER_SERVICE
          value: mindie-motor-controller-service.mindie-tmx.svc.cluster.local
        - name: COORDINATOR_SERVICE
          value: mindie-motor-coordinator-service.mindie-tmx.svc.cluster.local
        - name: KV_CONDUCTOR_SERVICE
          value: kv-conductor-vllm-0-kv-conductor-vllm-0-kv-conductor.mindie-tmx.svc.cluster.local
        command:
        - /bin/bash
        - -c
        - " source /mnt/configmap/boot.sh; \n "
        resources:
          requests:
            memory: 4Gi
            cpu: '16'
          limits:
            memory: 8Gi
            cpu: '64'
        volumeMounts:
        - name: motor-config
          mountPath: /mnt/configmap
        - name: coredump
          mountPath: /var/coredump
        - name: mnt
          mountPath: /mnt
        - name: plog-path
          mountPath: /root/ascend/log
        - name: weight-mount
          mountPath: /mnt/weight/
        - name: ascend-driver
          mountPath: /usr/local/Ascend/driver

      volumes:
      - name: motor-config
        configMap:
          name: motor-config
          defaultMode: 360
      - name: coredump
        hostPath:
          path: /var/coredump
          type: DirectoryOrCreate
      - name: mnt
        hostPath:
          path: /mnt
      - name: plog-path
        hostPath:
          path: /root/ascend/log
          type: DirectoryOrCreate
      - name: weight-mount
        hostPath:
          path: /mnt/weight/
      - name: ascend-driver
        hostPath:
          path: /usr/local/Ascend/driver

---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: mindie-motor-coordinator
  name: mindie-motor-coordinator-service
  namespace: mindie-tmx
spec:
  ports:
  - port: 1026
    protocol: TCP
    targetPort: 1026
  selector:
    app: mindie-motor-coordinator
  sessionAffinity: None
  type: ClusterIP
status:
  loadBalancer: {}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: mindie-motor-coordinator
  name: mindie-motor-coordinator-infer
  namespace: mindie-tmx
spec:
  ports:
  - nodePort: 31053
    port: 1025
    protocol: TCP
    targetPort: 1025
  selector:
    app: mindie-motor-coordinator
  sessionAffinity: None
  type: NodePort
status:
  loadBalancer: {}
